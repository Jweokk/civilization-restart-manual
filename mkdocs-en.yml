site_name: The Civilization Restart Manual
site_description: From a single stone back to electricity · 56 chapters · 286 eight-field process cards · Chinese and English
site_url: https://restart.fly2ai.top/en/
docs_dir: book-en
site_dir: build/site-en
repo_url: https://github.com/Jweokk/civilization-restart-manual
repo_name: GitHub
edit_uri: ""
copyright: CC BY-NC-SA 4.0 · Jweokk · 本版为快照，不跟随更新

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  alternate:
    - name: 中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

