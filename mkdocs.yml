site_name: 文明重启手册
site_description: 工业文明断档后，从一块石头重新走到电 · 56 章 · 286 张八字段工艺卡 · 中英双语
site_url: https://restart.fly2ai.top/
docs_dir: book
site_dir: build/site
repo_url: https://github.com/Jweokk/civilization-restart-manual
repo_name: GitHub
edit_uri: ""
copyright: CC BY-NC-SA 4.0 · Jweokk · 本版为快照，不跟随更新

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/favicon-192.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra:
  alternate:
    - name: 中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

